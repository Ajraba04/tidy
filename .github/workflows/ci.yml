name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install verified XcodeGen
        run: |
          bash scripts/verification/install-xcodegen.sh "$RUNNER_TEMP/tidy-tools"
          echo "$RUNNER_TEMP/tidy-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Core, model, synthetic native UI and universal Release verification
        run: bash scripts/verification/verify.sh
      - name: Retain exact toolchain, logs and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ github.sha }}
          path: |
            dist/verification/toolchain.txt
            dist/verification/*.log
            dist/verification/*.xcresult
            dist/verification/*.sha256
          if-no-files-found: error
