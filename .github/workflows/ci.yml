name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing personal should ship in the source tree by default. This
      # gate fails the build if it does.
      - name: Personal data grep gate
        run: |
          set -uo pipefail
          if grep -rniE 'binjamshid|albayyan|claude\.ai|/Users/[A-Za-z]' TidyCore/Sources Tidy; then
            echo "::error::Personal data pattern found in source files: see matches above"
            exit 1
          fi
          echo "No personal data patterns found."

      - name: Select Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${LATEST_XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Check generated project source membership
        run: python3 scripts/check-project-sources.py

      - name: swift test (TidyCore)
        working-directory: TidyCore
        run: swift test

      - name: Isolated process admission tests
        working-directory: TidyCore
        env:
          TIDY_ISOLATED_GATE_TESTS: "1"
        run: swift test --filter CoreOrchestrationTests

      - name: App model tests
        run: |
          xcodebuild -project Tidy.xcodeproj -scheme TidyAppModelTests -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath ./DerivedData test CODE_SIGNING_ALLOWED=NO

      - name: xcodebuild build (Tidy.app)
        run: |
          xcodebuild -project Tidy.xcodeproj -scheme Tidy -configuration Debug \
            -derivedDataPath ./DerivedData build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64"
