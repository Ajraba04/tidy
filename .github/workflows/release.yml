name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TIDY_RELEASE_VERSION: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate artifact version
        run: |
          [[ "$TIDY_RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1

      - name: Select Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${LATEST_XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install verified XcodeGen
        run: |
          bash scripts/verification/install-xcodegen.sh "$RUNNER_TEMP/tidy-tools"
          echo "$RUNNER_TEMP/tidy-tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Required correctness, native UI and universal build gates
        run: bash scripts/verification/verify.sh

      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ github.sha }}
          path: |
            dist/verification/toolchain.txt
            dist/verification/*.log
            dist/verification/*.xcresult
            dist/verification/*.sha256
          if-no-files-found: error

      - name: Release build
        run: |
          xcodebuild -project Tidy.xcodeproj -scheme Tidy -configuration Release \
            -derivedDataPath ./DerivedData build CODE_SIGNING_ALLOWED=NO \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO

      - name: Validate package version and architecture
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release/Tidy.app"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")
          [[ "${TIDY_RELEASE_VERSION#v}" == "$APP_VERSION" ]] || exit 1
          [[ "$APP_BUILD" =~ ^[1-9][0-9]*$ ]] || exit 1
          lipo -verify_arch arm64 "$APP_PATH/Contents/MacOS/Tidy"
          lipo -verify_arch x86_64 "$APP_PATH/Contents/MacOS/Tidy"

      # Signing and notarization remain opt-in through repository secrets.
      # Their existing configuration is unchanged; functionality and safety
      # acceptance are separate. See docs/UNSIGNED_INSTALL.md.
      #
      # `if:` conditions can't reference the secrets context directly, so
      # this step resolves it to a plain step output first.
      - name: Check for signing secret
        id: signing_check
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and notarize
        if: steps.signing_check.outputs.configured == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/tidy-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          APP_PATH="DerivedData/Build/Products/Release/Tidy.app"
          codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/Tidy-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"

          security delete-keychain "$KEYCHAIN_PATH"
          echo "TIDY_SIGNED=true" >> "$GITHUB_ENV"

      - name: Ad-hoc sign (unsigned release)
        if: steps.signing_check.outputs.configured == 'false'
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release/Tidy.app"
          codesign -s - --force --deep "$APP_PATH"
          echo "TIDY_SIGNED=false" >> "$GITHUB_ENV"

      - name: Zip release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent "DerivedData/Build/Products/Release/Tidy.app" "dist/Tidy-$TIDY_RELEASE_VERSION.zip"

      - name: Build DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "DerivedData/Build/Products/Release/Tidy.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Tidy" -srcfolder "$STAGING" -fs HFS+ \
            -format UDZO -ov "dist/Tidy-$TIDY_RELEASE_VERSION.dmg"

      - name: Record immutable artifact checksums and provenance
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 "Tidy-$TIDY_RELEASE_VERSION.zip" "Tidy-$TIDY_RELEASE_VERSION.dmg" > "Tidy-$TIDY_RELEASE_VERSION.sha256")
          {
            git rev-parse HEAD
            xcodebuild -version
            swift --version
            lipo -archs DerivedData/Build/Products/Release/Tidy.app/Contents/MacOS/Tidy
          } > "dist/Tidy-$TIDY_RELEASE_VERSION.provenance.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TIDY_SIGNED" = "true" ]; then
            NOTES="Signed and notarized. Should launch with no Gatekeeper warning."
          else
            NOTES="**Unsigned build.** macOS will warn that it can't verify the developer on first launch. See [docs/UNSIGNED_INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/UNSIGNED_INSTALL.md) for how to open it anyway. Check the versioned capability and acceptance record before use."
          fi
          gh release create "$TIDY_RELEASE_VERSION" \
            "dist/Tidy-$TIDY_RELEASE_VERSION.dmg" \
            "dist/Tidy-$TIDY_RELEASE_VERSION.zip" \
            "dist/Tidy-$TIDY_RELEASE_VERSION.sha256" \
            "dist/Tidy-$TIDY_RELEASE_VERSION.provenance.txt" \
            --title "Tidy $TIDY_RELEASE_VERSION" \
            --notes "$NOTES"
